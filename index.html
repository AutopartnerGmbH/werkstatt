<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Werkstatt"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#C0141C"/>
<link rel="manifest" id="manifestLink"/>
<title>Autopartner GmbH – Werkstatt</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --red:#C0141C;--red-dark:#8B0E13;--red-glow:rgba(192,20,28,0.22);
  --silver:#C8C8C8;--silver-dim:#6b7280;
  --bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
  --border:#2a2a2a;--border2:#333333;
  --text:#f0f0f0;--text-dim:#888888;--text-muted:#444444;
  --font-head:'Oswald',sans-serif;--font-body:'Open Sans',sans-serif;
}
[data-theme="light"]{
  --bg:#f4f4f4;--bg2:#ffffff;--bg3:#f0f0f0;--bg4:#e6e6e6;
  --border:#dcdcdc;--border2:#cccccc;
  --text:#1a1a1a;--text-dim:#666666;--text-muted:#999999;
  --silver:#444444;--silver-dim:#888888;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;height:100dvh;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);}
input,select,textarea,button{font-family:var(--font-body);}

/* HEADER */
#header{background:var(--bg2);border-bottom:2px solid var(--red);padding:0 16px;
  display:flex;align-items:stretch;height:72px;gap:0;overflow-x:auto;flex-shrink:0;}
.hlogo{display:flex;align-items:center;gap:12px;padding-right:20px;border-right:1px solid var(--border);flex-shrink:0;}
.hlogo-title{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--text);letter-spacing:.08em;text-transform:uppercase;line-height:1;}
.hlogo-sub{font-family:var(--font-head);font-weight:400;font-size:11px;color:var(--red);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
.hlogo-date{color:var(--text-dim);font-size:11px;margin-top:3px;}
.hstat{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--border);flex-shrink:0;}
.hstat-val{font-family:var(--font-head);font-weight:700;font-size:28px;}
.hstat-lbl{color:var(--text-dim);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;}
.hspace{flex:1;}
.hactions{display:flex;align-items:center;gap:6px;padding-left:10px;flex-shrink:0;}

/* SYNC */
#syncStatus{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;}
#syncStatus.ok{color:#4ade80;background:rgba(74,222,128,0.1);}
#syncStatus.syncing{color:#fbbf24;background:rgba(251,191,36,0.1);}
#syncStatus.error{color:var(--red);background:rgba(192,20,28,0.1);}

/* MOBILE TABS */
.mobile-tabs{display:none;background:#111;border-bottom:1px solid #2a2a2a;
  padding:6px 8px;overflow-x:auto;gap:4px;flex-shrink:0;}
.mobile-tab{background:var(--bg3);border:none;border-radius:6px;padding:6px 10px;
  color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;
  transition:background .15s;font-family:var(--font-body);}
.mobile-tab.active{background:var(--tab-color,var(--red));color:#fff;}
.mobile-tab .tab-count{background:rgba(0,0,0,0.3);border-radius:3px;padding:1px 5px;font-size:11px;}

/* BOARD */
#board{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column;position:relative;}
.board-grid{display:grid;gap:10px;height:100%;}

/* LANE */
.lane{display:flex;flex-direction:column;min-height:0;}
.lane-header{border-radius:6px 6px 0 0;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.lane-title{font-family:var(--font-head);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.lane-count{border-radius:4px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:700;font-size:13px;}
.lane-toggle-btn{background:rgba(0,0,0,0.3);border-radius:4px;padding:2px 6px;cursor:pointer;
  font-size:10px;font-weight:700;font-family:var(--font-head);letter-spacing:.04em;flex-shrink:0;}
.lane-body{border-radius:0 0 6px 6px;padding:6px;flex:1;overflow-y:auto;
  transition:background .15s,border-color .15s;border:2px solid var(--border);background:var(--bg2);}
.lane-body.ptr-drop-target{background:#1a0a0a;border-color:var(--red);box-shadow:inset 0 0 20px rgba(192,20,28,0.22);}
.lane-empty{color:var(--text-muted);text-align:center;padding:20px 8px;font-size:12px;
  font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase;}
.ptr-ghost{position:fixed;z-index:500;pointer-events:none;background:var(--bg4);border:2px solid var(--red);
  border-radius:6px;padding:8px 14px;font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--text);
  box-shadow:0 8px 20px rgba(0,0,0,.5);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* CARD */
.card-wrap{margin-bottom:6px;border-radius:6px;overflow:hidden;}
.card-top{display:flex;align-items:center;padding:10px 12px;cursor:pointer;user-select:none;transition:background .15s;}
.card-top:hover{background:rgba(255,255,255,0.04);}
.card-top-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:8px;}
.card-top-kz{font-family:var(--font-head);font-weight:700;font-size:17px;letter-spacing:.1em;white-space:nowrap;flex-shrink:0;margin-right:10px;}
.card-top-kunde{font-size:14px;font-weight:600;color:var(--silver);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-top-chevron{font-size:18px;color:var(--text-muted);flex-shrink:0;margin-left:6px;transition:transform .2s;line-height:1;}
.card-top-chevron.open{transform:rotate(180deg);}
.card-body{padding:4px 12px 8px;}
.card-fz{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.card-hints{background:rgba(0,0,0,0.3);border-radius:4px;padding:6px 10px;margin-bottom:4px;}
.hint-done-label{color:#4ade80;font-size:11px;font-weight:700;margin-bottom:4px;}
.card-hint{display:flex;align-items:center;gap:8px;padding:4px 0;}
.card-hint+.card-hint{border-top:1px solid var(--border);}
.hint-input{color:#ccc;font-size:13px;flex:1;background:transparent;border:none;outline:none;
  font-family:var(--font-body);padding:2px 4px;border-radius:3px;cursor:text;}
.hint-input:focus{background:var(--bg4);color:var(--text);}
.hint-input.done{color:var(--text-muted);text-decoration:line-through;}
.btn-erledigt{background:var(--bg4);border:1px solid var(--border2);border-radius:4px;
  color:var(--text-dim);padding:2px 8px;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.btn-erledigt:hover{background:#14532d;border-color:#16a34a;color:#4ade80;}
.btn-erledigt.done{background:#14532d44;border-color:#16a34a88;color:#4ade80;}
.hint-add-inline{display:flex;gap:6px;margin-top:6px;}
.hint-add-inline input{flex:1;background:var(--bg4);border:1px dashed var(--border2);border-radius:4px;
  color:var(--text-dim);padding:4px 8px;font-size:12px;outline:none;}
.hint-add-inline input:focus{border-color:var(--red);color:var(--text);}
.hint-add-inline button{background:var(--red);border:none;border-radius:4px;color:#fff;padding:0 10px;cursor:pointer;font-size:16px;font-weight:700;}
.abholbereit-banner{padding:6px 12px;color:#4ade80;font-size:11px;font-weight:700;
  font-family:var(--font-head);letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid rgba(74,222,128,0.25);}
.card-time{color:var(--text-muted);font-size:11px;padding:0 12px 6px;}
.card-actions{display:flex;border-top:1px solid var(--border);}
.card-actions button{flex:1;background:transparent;border:none;border-right:1px solid var(--border);
  color:var(--text-dim);padding:9px 4px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;}
.card-actions button:last-child{border-right:none;}
.card-actions button:hover{background:rgba(255,255,255,0.05);color:var(--text);}

/* VERSCHIEBEN-BUTTON (nur mobil sichtbar — Ersatz für Drag&Drop auf Touch-Geräten) */
.btn-move{display:none;}
.move-options-grid{display:flex;flex-wrap:wrap;gap:8px;}
.move-option{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;}
.move-option:hover:not(:disabled){background:var(--bg4);border-color:var(--red);}
.move-option:disabled{opacity:.35;cursor:default;}

/* MITARBEITER */
.ma-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(192,20,28,0.15);
  border:1px solid rgba(192,20,28,0.4);border-radius:20px;padding:3px 10px 3px 6px;
  font-size:12px;color:#E8454D;font-weight:600;margin:2px;}
.ma-badge-avatar{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.ma-badge-remove{background:none;border:none;color:rgba(232,69,77,0.5);cursor:pointer;font-size:14px;padding:0;line-height:1;margin-left:2px;}
.btn-ma{background:var(--bg4);border:1px dashed var(--border2);border-radius:20px;
  color:var(--text-dim);padding:3px 12px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap;}
.btn-ma:hover{border-color:var(--red);color:var(--red);}
#myNameBadge{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--border);flex-shrink:0;cursor:pointer;}
.my-avatar{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
#myNameText{font-size:12px;color:var(--text-dim);font-weight:600;}

/* SUCHE */
.search-wrap{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border2);
  border-radius:4px;overflow:hidden;flex-shrink:0;}
.search-wrap input{background:transparent;border:none;outline:none;color:var(--text);
  padding:6px 10px;font-size:12px;width:150px;}
.search-wrap input::placeholder{color:var(--text-muted);}
.search-clear{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 8px;font-size:14px;display:none;}
.search-clear.visible{display:block;}

@keyframes flashCard{0%{box-shadow:0 0 0 0 transparent;}25%{box-shadow:0 0 0 8px var(--flash-color);}
  50%{box-shadow:0 0 0 0 transparent;}75%{box-shadow:0 0 0 8px var(--flash-color);}100%{box-shadow:0 0 0 0 transparent;}}
.card-flash{animation:flashCard 2s ease-in-out forwards;}

/* SYNC STATUS */
#syncStatus { font-size:11px; padding:4px 10px; border-radius:20px; font-weight:600;
  letter-spacing:.04em; display:flex; align-items:center; gap:5px; }
#syncStatus.ok { color:#4ade80; background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.2); }
#syncStatus.syncing { color:#fbbf24; background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.2); }
#syncStatus.error { color:var(--red); background:rgba(192,20,28,0.08); border:1px solid rgba(192,20,28,0.2); }
.sync-dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }
#syncStatus.ok .sync-dot { animation:syncPulse 2s infinite; }
@keyframes syncPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ARBEITEN KOMPAKT */
.arbeit-row { display:flex; align-items:center; gap:6px; padding:6px 0;
  border-bottom:1px solid var(--border); }
.arbeit-row:last-child { border-bottom:none; }
.arbeit-input { flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-size:14px; font-family:var(--font-body); padding:2px 4px;
  border-radius:3px; min-width:0; resize:none; height:28px; overflow:hidden; }
.arbeit-input:focus { background:var(--bg4); }
.arbeit-std { width:56px; background:var(--bg4); border:1px solid var(--border2);
  border-radius:4px; color:var(--text); font-size:13px; padding:4px 6px;
  outline:none; text-align:center; flex-shrink:0; }
.arbeit-std:focus { border-color:var(--red); }
.arbeit-wer { font-size:11px; color:var(--text-muted); flex-shrink:0;
  white-space:nowrap; max-width:60px; overflow:hidden; text-overflow:ellipsis; }
.arbeit-del { background:none; border:none; color:var(--text-muted); cursor:pointer;
  font-size:14px; padding:0 2px; flex-shrink:0; line-height:1; }
.arbeit-del:hover { color:var(--red); }
.btn-diktier{background:var(--bg4);border:1px solid var(--border2);border-radius:20px;
  color:var(--text-dim);padding:5px 14px;cursor:pointer;font-size:12px;font-weight:600;
  transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.btn-diktier:hover{border-color:var(--red);color:var(--red);}
.btn-diktier.recording{background:rgba(192,20,28,0.15);border-color:var(--red);color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.diktier-preview{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:10px 14px;margin-top:8px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.diktier-preview.active{border-color:var(--red);color:var(--text);}

/* DIAGNOSE */
.diag-section{margin-bottom:14px;}
.diag-section-title{font-family:var(--font-head);font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--red);
  padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.diag-row{display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:var(--bg3);border-radius:4px;gap:8px;}
.diag-row-label{font-size:13px;color:var(--text);flex:1;}
.diag-btns{display:flex;gap:4px;flex-shrink:0;}
.diag-btn{border:none;border-radius:3px;padding:3px 10px;cursor:pointer;
  font-size:11px;font-weight:700;transition:all .15s;font-family:var(--font-body);}
.diag-btn-ok{background:var(--bg4);color:var(--text-dim);}
.diag-btn-ok.active{background:#14532d;color:#4ade80;}
.diag-btn-nok{background:var(--bg4);color:var(--text-dim);}
.diag-btn-nok.active{background:#7f1d1d;color:#fca5a5;}
.diag-btn-kein{background:var(--bg4);color:var(--text-dim);white-space:nowrap;}
.diag-btn-kein.active{background:#374151;color:#93c5fd;}
.diag-required{color:var(--red);}
.diag-input-row.required input{border-color:var(--red);}
.diag-input-row.error input{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,20,28,0.35);animation:diagPulse 1s infinite;}
@keyframes diagPulse{0%,100%{opacity:1}50%{opacity:.6}}
.diag-warn-banner{display:none;align-items:center;gap:12px;background:#7f1d1d;border:2px solid var(--red);
  border-radius:8px;padding:16px 18px;margin-bottom:14px;color:#fff;font-size:16px;font-weight:700;line-height:1.4;}
.diag-warn-banner .diag-warn-icon{font-size:28px;flex-shrink:0;}
.diag-warn-banner.shake{animation:shake .4s;}
.diag-input-row{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.diag-input-row label{font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.diag-input-row input,.diag-input-row textarea{
  background:var(--bg3);border:1px solid var(--border2);border-radius:4px;
  color:var(--text);padding:8px 10px;font-size:13px;outline:none;font-family:var(--font-body);}
.diag-input-row textarea{resize:vertical;}

/* ADMIN */
.admin-section{background:var(--bg3);border-radius:8px;padding:16px;margin-bottom:14px;}
.admin-section-title{font-family:var(--font-head);font-size:13px;font-weight:600;
  color:var(--red);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border);}
.admin-row{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);gap:12px;}
.admin-row:last-child{border-bottom:none;}
.admin-row-label{font-size:13px;color:var(--text);flex:1;}
.admin-row-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-box{background:var(--bg4);border-radius:6px;padding:12px;text-align:center;}
.stat-box-val{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--red);}
.stat-box-lbl{font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:.06em;text-transform:uppercase;}

/* PIN */
#pinScreen{position:fixed;inset:0;background:#030712;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.pin-logo{font-family:var(--font-head);font-size:22px;color:var(--text);letter-spacing:.1em;text-transform:uppercase;}
.pin-sub{font-family:var(--font-head);font-size:12px;color:var(--red);letter-spacing:.14em;text-transform:uppercase;margin-top:-14px;}
.pin-dots{display:flex;gap:12px;margin:8px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s;}
.pin-dot.filled{background:var(--red);border-color:var(--red);}
.pin-dot.error{background:#7f1d1d;border-color:var(--red);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;}
.pin-key{width:72px;height:72px;border-radius:50%;background:var(--bg3);
  border:1px solid var(--border2);color:var(--text);font-size:22px;font-weight:500;
  cursor:pointer;transition:all .15s;font-family:var(--font-head);}
.pin-key:hover{background:var(--bg4);border-color:var(--red);}
.pin-key:active{transform:scale(0.92);}
.pin-hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
.btn-bio{background:rgba(192,20,28,0.15);border:1px solid var(--red);border-radius:8px;
  color:var(--red);padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600;
  font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;}

/* BUTTONS */
.btn-primary{background:var(--red);border:none;border-radius:4px;color:#fff;padding:7px 14px;
  cursor:pointer;font-size:12px;font-weight:700;font-family:var(--font-head);
  letter-spacing:.08em;text-transform:uppercase;}
.btn-primary:hover{background:var(--red-dark);}
.btn-secondary{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;
  color:var(--text-dim);padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;}
.btn-secondary:hover{background:var(--bg4);color:var(--text);}
.theme-toggle{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;
  padding:6px 10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;
  color:var(--text-dim);transition:all .15s;}
.theme-toggle:hover{border-color:var(--red);}

/* MÜLLEIMER */
#trash{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:64px;height:64px;border-radius:50%;background:#1a0000;border:2px dashed #7f1d1d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:22px;color:#7f1d1d;transition:all .2s;z-index:100;opacity:0;pointer-events:none;}
#trash.drag-active{opacity:1;pointer-events:all;}
#trash.over{background:#450a0a;border-color:var(--red);border-style:solid;color:var(--red);
  transform:translateX(-50%) scale(1.15);box-shadow:0 0 30px var(--red-glow);}
#trash-label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-top:3px solid var(--red);
  border-radius:6px;width:100%;max-width:700px;padding:24px;

async function callClaude(system,content){
  const key=getAnthropicKey();
  if(!key)throw new Error('Kein Anthropic API-Key hinterlegt. Bitte im Adminbereich eintragen.');
  const messages=typeof content==='string'
    ?[{role:'user',content}]
    :[{role:'user',content}];
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1000,system,messages})
  });
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    throw new Error('Anthropic API Fehler ('+res.status+'): '+t.slice(0,200));

  const data=await res.json();

// ── BIOMETRIE ──
const BIO_KEY='werkstatt-bio-cred';
function str2ab(s){return new TextEncoder().encode(s).buffer;}
function ab2b64(b){return btoa(String.fromCharCode(...new Uint8Array(b)));}
function b642ab(b){const bin=atob(b);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}
async function bioVerfuegbar(){if(!window.PublicKeyCredential)return false;try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch{return false;}}
async function bioRegistrieren(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:str2ab('werkstatt-reg-'+Date.now()),
      rp:{name:'Autopartner Werkstatt',id:location.hostname},
      user:{id:str2ab('werkstatt-user'),name:'Werkstatt',displayName:'Werkstatt'},
      pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    localStorage.setItem(BIO_KEY,ab2b64(cred.rawId));
    return true;
  }catch{return false;}
}
async function bioLogin(){
  const credId=localStorage.getItem(BIO_KEY); if(!credId)return;
  const hint=document.getElementById('pinHint');
  if(hint){hint.textContent='⏳ Warte …';}
  try{
    await navigator.credentials.get({publicKey:{
      challenge:str2ab('werkstatt-'+Date.now()),
      allowCredentials:[{id:b642ab(credId),type:'public-key'}],
      userVerification:'required',timeout:60000
    }});
    pinErfolgreich();
  }catch{
    if(hint){hint.textContent='❌ Nicht erkannt'; hint.style.color='var(--red)';}
    setTimeout(()=>{if(hint){hint.textContent='Code eingeben';hint.style.color='';}},2000);
  }
}
async function initBio(){
  const ok=await bioVerfuegbar(); if(!ok)return;
  const credId=localStorage.getItem(BIO_KEY);
  const btn=document.getElementById('bioBtn');
  const isIOS=/iPhone|iPad/.test(navigator.userAgent);
  if(btn){
    document.getElementById('bioIcon').textContent=isIOS?'':'👆';
    document.getElementById('bioLabel').textContent=isIOS?'Face ID / Touch ID':'Fingerabdruck';
    if(credId){btn.style.display='flex';setTimeout(()=>bioLogin(),500);}
  }
}
async function angebotBioRegistrieren(){
  if(!(await bioVerfuegbar())||localStorage.getItem(BIO_KEY))return;
  const isIOS=/iPhone|iPad/.test(navigator.userAgent);
  const bioName=isIOS?'Face ID / Touch ID':'Fingerabdruck';
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px';
  o.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border2);border-top:3px solid var(--red);border-radius:6px;padding:28px;max-width:360px;width:100%;text-align:center">
    <div style="font-size:36px;margin-bottom:12px">${isIOS?'':'👆'}</div>
    <div style="font-family:var(--font-head);font-size:14px;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">${bioName} aktivieren?</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:20px;line-height:1.6">Beim nächsten Öffnen ohne Code entsperren.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn-secondary" id="bioNein">Später</button>
      <button class="btn-primary" id="bioJa">${bioName} aktivieren</button>
    </div></div>`;
  document.body.appendChild(o);
  o.querySelector('#bioNein').addEventListener('click',()=>document.body.removeChild(o));
  o.querySelector('#bioJa').addEventListener('click',async()=>{document.body.removeChild(o);await bioRegistrieren();const b=document.getElementById('bioBtn');if(b)b.style.display='flex';});
}

// ── THEME (HELL/DUNKEL) ──
function initTheme(){
  const saved = localStorage.getItem('werkstatt-theme') || 'dark';
  applyTheme(saved);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.addEventListener('click', toggleTheme);
}
function applyTheme(theme){
  if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  if(icon) icon.textContent = theme==='light' ? '☀️' : '🌙';
}
function toggleTheme(){
  const current = localStorage.getItem('werkstatt-theme') || 'dark';
  const next = current==='light' ? 'dark' : 'light';
  localStorage.setItem('werkstatt-theme', next);
  applyTheme(next);
}
initTheme();

// ── PIN ──
let pinInput='';
function pinPress(k){
  if(k==='⌫')pinInput=pinInput.slice(0,-1);
  else if(pinInput.length<6)pinInput+=k;
  updatePinDots();
  if(pinInput.length===6)checkPin();
}
function updatePinDots(){
  for(let i=0;i<6;i++){const d=document.getElementById('pd'+i);d.classList.toggle('filled',i<pinInput.length);d.classList.remove('error');}
}
function checkPin(){
  if(pinInput===getPin()){
    pinErfolgreich();
  }else{
    for(let i=0;i<6;i++)document.getElementById('pd'+i).classList.add('error');
    const h=document.getElementById('pinHint');h.textContent='❌ Falscher Code';h.style.color='var(--red)';
    setTimeout(()=>{pinInput='';updatePinDots();h.textContent='Code eingeben';h.style.color='';},1000);
  }
}
function pinErfolgreich(){
  document.getElementById('pinScreen').style.display='none';
  sessionStorage.setItem('werkstatt-auth','1');
  initMyName();loadAutos();loadMitarbeiterliste();startRealtime();
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('pinScreen').style.display==='none')return;
  if(e.key>='0'&&e.key<='9')pinPress(e.key);
  if(e.key==='Backspace')pinPress('⌫');
});

// ── SUPABASE ──
async function sbFetch(path,options={}){
  const res=await fetch(SUPABASE_URL+path,{...options,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...options.headers}});
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):[];
}
function setSync(s,m){
  const el=document.getElementById('syncStatus');
  const tx=document.getElementById('syncText');
  if(el)el.className=s;
  if(tx)tx.textContent=m;
}
let istErsterLoad=true;
async function loadAutos(){
  try{
    setSync('syncing','↻ Laden …');
    const data=await sbFetch('/rest/v1/auftraege?order=erstellt_am.asc');
    autos=data.map(dbToAuto);
    if(istErsterLoad){collapsedCards=new Set(autos.map(a=>a.id));expandedCards=new Set();istErsterLoad=false;}
    setSync('ok','● Live');render();
  }catch(e){setSync('error','✕ Fehler');console.error(e);}
}
function dbToAuto(row){
  return{
    id:row.id,kennzeichen:row.kennzeichen||'',fahrzeug:row.fahrzeug||'',
    kunde:row.kunde||'',platz:row.platz||'',prioritaet:row.prioritaet||'Normal',
    status:row.status||'parkplatz',auftragsnr:row.auftragsnr||'',
    hinweise:(row.hinweise||[]).map(h=>typeof h==='string'?{text:h,done:false}:h),
    diagnose:row.diagnose||null,
    mitarbeiter:row.mitarbeiter||[],
    dateien:row.dateien||[],
    arbeiten:row.arbeiten||[],
    material:row.material||[],
    lieferscheine:row.lieferscheine||[],
    zugewiesenAn:row.zugewiesen_an||null,
    zuwPos:(typeof row.zuweisung_pos==='number')?row.zuweisung_pos:0,
    istAufgabe:!!row.ist_aufgabe,
    aufgabeText:row.aufgabe_text||'',
    eingang:row.eingang||uhrzeit(),datum:row.datum||datumKurz(),statusSeit:row.status_seit||uhrzeit(),
  };
}
function autoToDb(a){
  return{id:a.id,kennzeichen:a.kennzeichen,fahrzeug:a.fahrzeug,kunde:a.kunde,platz:a.platz,
    prioritaet:a.prioritaet,status:a.status,auftragsnr:a.auftragsnr||'',
    hinweise:a.hinweise,diagnose:a.diagnose||null,mitarbeiter:a.mitarbeiter||[],
    dateien:a.dateien||[],arbeiten:a.arbeiten||[],material:a.material||[],
    lieferscheine:a.lieferscheine||[],
    zugewiesen_an:a.zugewiesenAn||null,zuweisung_pos:(typeof a.zuwPos==='number')?a.zuwPos:0,
    ist_aufgabe:!!a.istAufgabe,aufgabe_text:a.aufgabeText||'',
    eingang:a.eingang,datum:a.datum,status_seit:a.statusSeit,
    geaendert_am:new Date().toISOString()};
}
async function saveAuto(a){
  try{
    setSync('syncing','↻ …');
    await sbFetch('/rest/v1/auftraege',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(autoToDb(a))});
    setSync('ok','● Live');
  }catch(e){setSync('error','✕ Fehler');console.error(e);}
}
async function deleteAuto(id){
  try{await sbFetch('/rest/v1/auftraege?id=eq.'+id,{method:'DELETE'});}catch(e){console.error(e);}
}
async function uploadFile(file,pfad){
  const res=await fetch(SUPABASE_URL+'/storage/v1/object/'+pfad,{method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':file.type,'x-upsert':'true'},body:file});
  if(!res.ok)throw new Error(await res.text());

// ── POLLING ──
function startRealtime(){
  setInterval(async()=>{
    if(aufgabeInputOffenFuer)return; // nicht aktualisieren, solange jemand eine Aufgabe eintippt
    if(adminMitarbeiterOffen)return; // nicht aktualisieren, solange die Mitarbeiterverwaltung bearbeitet wird
    if(ptrDrag)return; // nicht aktualisieren, solange gerade eine Karte gezogen wird
    try{
      const data=await sbFetch('/rest/v1/auftraege?select=id,geaendert_am&order=erstellt_am.asc');
      const changed=data.some(r=>{const l=autos.find(a=>a.id===r.id);return !l||r.geaendert_am>=(l.geaendert_am||'');})|| data.length!==autos.length;
      if(changed)loadAutos();
    }catch{}
    try{
      const maData=await sbFetch('/rest/v1/mitarbeiter?select=id,geaendert_am&order=position.asc');
      const maChanged=maData.some(r=>{const l=MITARBEITERLISTE.find(m=>m.id===r.id);return !l;})|| maData.length!==MITARBEITERLISTE.length;
      if(maChanged)loadMitarbeiterliste();
    }catch{}
  },5000);
}

// ── DRAG & DROP (Pointer Events — funktioniert einheitlich mit Maus UND Touch) ──
const trash=document.getElementById('trash');
let ptrDrag=null;          // {kind:'board'|'assign', id, source, el, startX, startY, moved, ghost}
let dropHighlightEl=null;
let suppressClickUntil=0;
const PTR_DRAG_THRESHOLD=8;

function wireDraggable(el,kind,idFn,sourceFn){
  el.style.touchAction='none'; // verhindert Scrollen des Bildschirms während des Ziehens
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(e.target.closest('button'))return;
    ptrDrag={kind,id:idFn(),source:sourceFn(),el,startX:e.clientX,startY:e.clientY,moved:false,ghost:null};
    try{el.setPointerCapture(e.pointerId);}catch(err){}
  });
  el.addEventListener('pointermove',ptrDragMove);
  el.addEventListener('pointerup',ptrDragEnd);
  el.addEventListener('pointercancel',ptrDragCancel);
}

function ptrDragMove(e){
  if(!ptrDrag)return;
  const dx=e.clientX-ptrDrag.startX, dy=e.clientY-ptrDrag.startY;
  if(!ptrDrag.moved&&Math.hypot(dx,dy)>PTR_DRAG_THRESHOLD){
    ptrDrag.moved=true;
    ptrDrag.ghost=document.createElement('div');
    ptrDrag.ghost.className='ptr-ghost';
    ptrDrag.ghost.textContent=(ptrDrag.el.textContent||'').trim().replace(/\s+/g,' ').slice(0,44);
    document.body.appendChild(ptrDrag.ghost);
    ptrDrag.el.style.opacity='0.35';
    if(ptrDrag.kind==='board'){trash.classList.add('drag-active');}
  }
  if(ptrDrag.moved){
    ptrDrag.ghost.style.left=(e.clientX+14)+'px';
    ptrDrag.ghost.style.top=(e.clientY+14)+'px';
    updateDropHighlight(e.clientX,e.clientY);
    e.preventDefault();
  }
}

function updateDropHighlight(x,y){
  const el=document.elementFromPoint(x,y);
  let target=null;
  if(el){
    if(ptrDrag.kind==='board')target=el.closest('#trash');
    if(!target)target=el.closest('.lane-body')||el.closest('.zone-btn')||el.closest('.mab-half[data-ma-id]');
  }
  if(target!==dropHighlightEl){
    if(dropHighlightEl){dropHighlightEl.classList.remove('ptr-drop-target');if(dropHighlightEl.id==='trash'){trash.classList.remove('over');document.getElementById('trashIcon').textContent='🗑️';}}
    if(target){target.classList.add('ptr-drop-target');if(target.id==='trash'){trash.classList.add('over');document.getElementById('trashIcon').textContent='🔥';}}
    dropHighlightEl=target;
  }
}
function clearDropHighlight(){
  if(dropHighlightEl){dropHighlightEl.classList.remove('ptr-drop-target');if(dropHighlightEl.id==='trash'){trash.classList.remove('over');document.getElementById('trashIcon').textContent='🗑️';}}
  dropHighlightEl=null;
}

function ptrDragEnd(e){
  if(!ptrDrag)return;
  if(ptrDrag.moved){
    performPtrDrop(e.clientX,e.clientY,ptrDrag);
    ptrDrag.el.style.opacity='';
    if(ptrDrag.ghost)ptrDrag.ghost.remove();
    clearDropHighlight();
    trash.classList.remove('drag-active','over');
    document.getElementById('trashIcon').textContent='🗑️';
    suppressClickUntil=Date.now()+300;
  }
  ptrDrag=null;
}
function ptrDragCancel(){
  if(!ptrDrag)return;
  ptrDrag.el.style.opacity='';
  if(ptrDrag.ghost)ptrDrag.ghost.remove();
  clearDropHighlight();
  trash.classList.remove('drag-active','over');
  document.getElementById('trashIcon').textContent='🗑️';
  ptrDrag=null;
}

function performPtrDrop(x,y,drag){
  const el=document.elementFromPoint(x,y);
  if(!el)return;
  const dragged=autos.find(v=>v.id===drag.id);
  if(dragged&&dragged.istAufgabe&&!el.closest('.mab-half[data-ma-id]'))return; // Aufgaben gehören nur in die Mitarbeiterzeile
  if(drag.kind==='board'&&el.closest('#trash')){
    const id=drag.id;
    const a=autos.find(v=>v.id===id);
    openConfirm(`Auftrag "${a?.kennzeichen||id}" endgültig löschen?`,async()=>{autos=autos.filter(v=>v.id!==id);await deleteAuto(id);render();});
    return;
  }
  const laneBody=el.closest('.lane-body');
  if(laneBody){
    const status=laneBody.closest('.lane').dataset.status;
    const a=autos.find(v=>v.id===drag.id);
    if(a&&a.status!==status){a.status=status;a.statusSeit=uhrzeit();saveAuto(a);render();}
    return;
  }
  const zoneBtn=el.closest('.zone-btn');
  if(zoneBtn){
    const wrap=zoneBtn.closest('.zone-btn-wrap');
    const status=wrap?.dataset.zoneId;
    const a=autos.find(v=>v.id===drag.id);
    if(status&&a&&a.status!==status){a.status=status;a.statusSeit=uhrzeit();saveAuto(a);render();}
    return;
  }
  const mabHalf=el.closest('.mab-half[data-ma-id]');
  if(mabHalf){
    const maId=mabHalf.dataset.maId;
    const a=autos.find(v=>v.id===drag.id);
    if(a){
      // Zielposition anhand der Maus-/Fingerposition zwischen den vorhandenen Karten bestimmen
      const karten=[...mabHalf.querySelectorAll('.mab-card')].filter(c=>c!==drag.el);
      let einfuegeIndex=karten.length;
      for(let idx=0;idx<karten.length;idx++){
        const rect=karten[idx].getBoundingClientRect();
        if(x<rect.left+rect.width/2){einfuegeIndex=idx;break;}
      }
      let liste=autos.filter(v=>v.zugewiesenAn===maId&&v.id!==a.id).sort((p,q)=>(p.zuwPos||0)-(q.zuwPos||0));
      liste.splice(einfuegeIndex,0,a);
      liste.forEach((item,idx)=>{item.zugewiesenAn=maId;item.zuwPos=idx+1;saveAuto(item);});
      render();
    }
    return;
  }
}

// ── MOBILE TABS ──
function renderMobileTabs(){
  const c=document.getElementById('mobileTabs');if(!c)return;
  c.innerHTML='';
  const sichtbar = STATI.filter(s=>!s.hidden && !s.headerZone);
  if(!sichtbar.find(s=>s.id===activeMobileTab) && sichtbar.length>0) activeMobileTab = sichtbar[0].id;
  sichtbar.forEach(s=>{
    const count=autos.filter(a=>a.status===s.id).length;
    const btn=document.createElement('button');
    btn.className='mobile-tab'+(activeMobileTab===s.id?' active':'');
    btn.style.setProperty('--tab-color',s.color);
    btn.innerHTML=`<span>${s.icon}</span><span>${s.label}</span>${count>0?`<span class="tab-count">${count}</span>`:''}`;
    btn.addEventListener('click',()=>{activeMobileTab=s.id;renderMobileTabs();updateMobileLanes();});
    c.appendChild(btn);
  });
}
function updateMobileLanes(){
  if(window.innerWidth>768)return;
  document.querySelectorAll('.lane').forEach(l=>l.classList.remove('mobile-active'));
  const al=document.querySelector(`.lane[data-status="${activeMobileTab}"]`);
  if(al)al.classList.add('mobile-active');
}
window.addEventListener('resize',updateMobileLanes);

// ── COLLAPSE ──
function isCollapsed(id,autoCollapse){return autoCollapse?!expandedCards.has(id):collapsedCards.has(id);}
function toggleCard(id,autoCollapse){
  if(autoCollapse){if(expandedCards.has(id))expandedCards.delete(id);else expandedCards.add(id);}
  else{if(collapsedCards.has(id))collapsedCards.delete(id);else collapsedCards.add(id);}
  render();
}

// ── RENDER ──
function render(){
  const grid=document.getElementById('boardGrid');grid.innerHTML='';
  const sichtbareSpalten = STATI.filter(s=>!s.hidden && !s.headerZone);
  grid.style.gridTemplateColumns = `repeat(${sichtbareSpalten.length}, 1fr)`;
  grid.style.minWidth = (sichtbareSpalten.length * 190) + 'px';

  sichtbareSpalten.forEach(s=>grid.appendChild(buildLane(s)));

  renderMobileTabs();updateMobileLanes();
  renderZoneButtons();
  renderMitarbeiterZeilen();
  positionMabResizeGrip();
}

function buildLane(s){
  const cards=autos.filter(a=>a.status===s.id)
    .sort((a,b)=>({'Express':0,'Dringend':1,'Normal':2}[a.prioritaet])-({'Express':0,'Dringend':1,'Normal':2}[b.prioritaet]));
  const autoCollapse=cards.length>=COLLAPSE_AT;

  const lane=document.createElement('div');lane.className='lane';lane.dataset.status=s.id;

  const hdr=document.createElement('div');hdr.className='lane-header';
  hdr.style.cssText=`background:${s.color};border:1px solid ${s.accent}44;box-shadow:0 0 14px ${s.glow}`;
  hdr.innerHTML=`<span style="font-size:18px">${s.icon}</span>
    <span class="lane-title" style="color:${s.accent}">${s.label}</span>
    ${cards.length>0?`<span class="lane-count" style="background:rgba(0,0,0,0.4);color:${s.accent}">${cards.length}</span>`:''}`;
  if(cards.length>0&&autoCollapse){
    const btn=document.createElement('button');btn.className='lane-toggle-btn';
    btn.style.cssText=`border:1px solid ${s.accent}66;color:${s.accent}`;
    const allOpen=cards.every(c=>expandedCards.has(c.id));
    btn.textContent=allOpen?'▲ Alle zu':'▼ Alle auf';
    btn.addEventListener('click',e=>{e.stopPropagation();if(allOpen)cards.forEach(c=>expandedCards.delete(c.id));else cards.forEach(c=>expandedCards.add(c.id));render();});
    hdr.appendChild(btn);
  }
  lane.appendChild(hdr);

  const body=document.createElement('div');body.className='lane-body';

  if(cards.length===0){body.innerHTML='<div class="lane-empty">Leer</div>';}
  else cards.forEach(a=>body.appendChild(makeCard(a,s,autoCollapse,isCollapsed(a.id,autoCollapse))));
  lane.appendChild(body);
  return lane;
}

// ── KARTE ──
function makeCard(a,s,autoCollapse,collapsed){
  const wrap=document.createElement('div');wrap.className='card-wrap';
  wrap.style.cssText=`background:var(--bg3);border:1px solid ${s.accent}33;box-shadow:0 2px 12px ${s.glow}`;

  if(a.status==='fertig'){const b=document.createElement('div');b.className='abholbereit-banner';b.textContent='🏁 Fahrzeug abholbereit';wrap.appendChild(b);}

  const top=document.createElement('div');top.className='card-top';
  wireDraggable(top,'board',()=>a.id,()=>a.status);
  top.addEventListener('click',()=>{if(Date.now()<suppressClickUntil)return;toggleCard(a.id,autoCollapse);});

  const prio=document.createElement('div');prio.className='card-top-prio';
  prio.style.cssText=`background:${PRIO_DOT[a.prioritaet]};${a.prioritaet!=='Normal'?`box-shadow:0 0 5px ${PRIO_DOT[a.prioritaet]}`:''}`;
  const kz=document.createElement('span');kz.className='card-top-kz';kz.style.color=s.accent;kz.textContent=a.kennzeichen||'—';
  const kunde=document.createElement('span');kunde.className='card-top-kunde';kunde.textContent=[a.kunde,a.fahrzeug].filter(Boolean).join(' – ');
  const chev=document.createElement('span');chev.className='card-top-chevron'+(collapsed?'':' open');chev.textContent='▾';
  top.appendChild(prio);top.appendChild(kz);top.appendChild(kunde);top.appendChild(chev);
  wrap.appendChild(top);

  if(!collapsed){
    const body=document.createElement('div');body.className='card-body';
    const fz=document.createElement('div');fz.className='card-fz';
    fz.innerHTML=`${a.fahrzeug||'Fahrzeug unbekannt'}${a.platz?` · <span style="color:var(--text-muted)">${a.platz}</span>`:''}`;
    body.appendChild(fz);

    // Stichpunkte
    if((a.hinweise||[]).length>0){
      const hd=document.createElement('div');hd.className='card-hints';
      const dc=(a.hinweise||[]).filter(h=>h.done).length;
      if(dc>0){const l=document.createElement('div');l.className='hint-done-label';l.textContent=`✓ ${dc} von ${a.hinweise.length} erledigt`;hd.appendChild(l);}
      (a.hinweise||[]).forEach((h,i)=>{
        const row=document.createElement('div');row.className='card-hint';
        const inp=document.createElement('input');inp.className='hint-input'+(h.done?' done':'');inp.type='text';inp.value=h.text;
        if(h.done)inp.disabled=true;
        inp.addEventListener('click',e=>e.stopPropagation());
        inp.addEventListener('blur',()=>{const v=inp.value.trim();if(v&&v!==h.text){h.text=v;saveAuto(a);}});
        inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});
        const btn=document.createElement('button');btn.className='btn-erledigt'+(h.done?' done':'');btn.textContent=h.done?'↩':'✓';
        btn.addEventListener('click',e=>{e.stopPropagation();h.done=!h.done;saveAuto(a);render();});
        row.appendChild(inp);row.appendChild(btn);hd.appendChild(row);
      });
      const ar=document.createElement('div');ar.className='hint-add-inline';
      const ai=document.createElement('input');ai.placeholder='+ Stichpunkt …';
      ai.addEventListener('click',e=>e.stopPropagation());
      ai.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();const v=ai.value.trim();if(v){a.hinweise.push({text:v,done:false});saveAuto(a);render();}}});
      const ab=document.createElement('button');ab.textContent='+';
      ab.addEventListener('click',e=>{e.stopPropagation();const v=ai.value.trim();if(v){a.hinweise.push({text:v,done:false});saveAuto(a);render();}});
      ar.appendChild(ai);ar.appendChild(ab);hd.appendChild(ar);
      body.appendChild(hd);
    }

    wrap.appendChild(body);

    const timeEl=document.createElement('div');timeEl.className='card-time';timeEl.textContent=`${a.datum} · ${a.eingang}`;
    wrap.appendChild(timeEl);

    // Zugeteilt an (Mitarbeiterzeile)
    if(a.zugewiesenAn){
      const zugewiesenerMa=MITARBEITERLISTE.find(m=>m.id===a.zugewiesenAn);
      const zuEl=document.createElement('div');
      zuEl.style.cssText='padding:0 12px 6px;font-size:12px;color:#E8454D;font-weight:700;display:flex;align-items:center;gap:5px;';
      zuEl.textContent=`📌 Zugeteilt an: ${zugewiesenerMa?zugewiesenerMa.name:'unbekannt'}`;
      wrap.appendChild(zuEl);
    }

    // Mitarbeiter
    const maDiv=document.createElement('div');maDiv.style.cssText='padding:4px 12px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;';
    (a.mitarbeiter||[]).forEach(m=>{
      const badge=document.createElement('div');badge.className='ma-badge';
      const isMe=m.name===myName;
      badge.innerHTML=`<div class="ma-badge-avatar">${m.name.charAt(0).toUpperCase()}</div><span>${m.name}</span><span style="font-size:10px;color:rgba(232,69,77,0.6);margin-left:2px">seit ${m.seit}</span>`;
      if(isMe){const rb=document.createElement('button');rb.className='ma-badge-remove';rb.textContent='✕';rb.addEventListener('click',e=>{e.stopPropagation();removeMitarbeiter(a.id,m.name);});badge.appendChild(rb);}
      maDiv.appendChild(badge);
    });
    const amIon=(a.mitarbeiter||[]).some(m=>m.name===myName);
    const btnMa=document.createElement('button');btnMa.className='btn-ma';
    btnMa.textContent=amIon?'✓ Ich bin dran':'+ Ich arbeite daran';
    if(amIon){btnMa.style.borderColor='var(--red)';btnMa.style.color='var(--red)';btnMa.style.background='rgba(192,20,28,0.1)';}
    btnMa.addEventListener('click',e=>{e.stopPropagation();toggleMitarbeiter(a.id);});
    maDiv.appendChild(btnMa);wrap.appendChild(maDiv);

    // Buttons
    const actions=document.createElement('div');actions.className='card-actions';
    const btnEdit=document.createElement('button');btnEdit.textContent='✎ Bearbeiten';btnEdit.addEventListener('click',e=>{e.stopPropagation();openEdit(a.id);});
    const btnDiag=document.createElement('button');btnDiag.textContent='📋 Diagnose';btnDiag.style.color='#fbbf24';btnDiag.addEventListener('click',e=>{e.stopPropagation();openDiagnose(a.id);});
    const btnArb=document.createElement('button');btnArb.textContent='📝 Arbeiten';btnArb.style.color='#AFA9EC';btnArb.addEventListener('click',e=>{e.stopPropagation();openArbeitenModal(a.id);});
    const btnMove=document.createElement('button');btnMove.textContent='↔ Verschieben';btnMove.className='btn-move';btnMove.style.color='#67E8F9';btnMove.addEventListener('click',e=>{e.stopPropagation();openMoveMenu(a.id);});
    actions.appendChild(btnEdit);actions.appendChild(btnDiag);actions.appendChild(btnArb);actions.appendChild(btnMove);wrap.appendChild(actions);
  }
  return wrap;
}

          </div>`;

      dd.style.top=(rect.bottom+4)+'px';

    btn.addEventListener('click',e=>{

      e.stopPropagation();

      if(!isOpen){positionDropdown();wrap.classList.add('force-open');}
    });

    c.appendChild(wrap);
  });
}

// ── MITARBEITER (Zuweisungs-Zeilen) — auf allen Geräten live synchronisiert über die Datenbank ──
let MITARBEITERLISTE = [];
let mitarbeiterDbVerfuegbar = true;
let mitarbeiterSyncWarnung=false;
async function loadMitarbeiterliste(){
  try{
    const data=await sbFetch('/rest/v1/mitarbeiter?order=position.asc');
    mitarbeiterDbVerfuegbar=true;
    const hoeheEintrag=data.find(r=>r.id===MAB_HOEHE_SENTINEL_ID);
    if(hoeheEintrag){
      try{const cfg=JSON.parse(hoeheEintrag.name);if(cfg&&typeof cfg.vh==='number')applyMitarbeiterzeileHoehe(cfg.vh,false);}catch(e){}
    }
    const geladen=data.filter(r=>r.id!==MAB_HOEHE_SENTINEL_ID).map(r=>({id:r.id,name:r.name,position:typeof r.position==='number'?r.position:0}));
    const vorherigerCache=localStorage.getItem('werkstatt-mitarbeiterliste-cache');
    if(geladen.length===0&&vorherigerCache){
      // Datenbank liefert (noch) nichts zurück, obwohl lokal schon Mitarbeiter bekannt sind —
      // das deutet auf ein Speicherproblem hin (z.B. fehlende Schreibrechte/RLS in Supabase).
      // Lokalen Stand NICHT überschreiben, damit nichts verschwindet.
      console.warn('Datenbank liefert eine leere Mitarbeiterliste, obwohl lokal bereits Mitarbeiter bekannt sind. Vermutlich schlägt das Speichern in der Datenbank fehl (z.B. Row-Level-Security). Behalte den lokalen Stand.');
      mitarbeiterSyncWarnung=true;
      try{MITARBEITERLISTE=JSON.parse(vorherigerCache);}catch(e2){MITARBEITERLISTE=geladen;}
    }else{
      MITARBEITERLISTE=geladen;
      localStorage.setItem('werkstatt-mitarbeiterliste-cache',JSON.stringify(MITARBEITERLISTE));
    }
    render();
  }catch(e){
    console.error('Mitarbeiterliste konnte nicht aus der Datenbank geladen werden — Tabelle "mitarbeiter" evtl. noch nicht angelegt. Nutze lokalen Zwischenspeicher als Sicherheitsnetz.',e);
    mitarbeiterDbVerfuegbar=false;
    const cache=localStorage.getItem('werkstatt-mitarbeiterliste-cache');
    if(cache){try{MITARBEITERLISTE=JSON.parse(cache);}catch(e2){}}
    render();
  }
}
async function saveMitarbeiterliste(){
  localStorage.setItem('werkstatt-mitarbeiterliste-cache',JSON.stringify(MITARBEITERLISTE));
  for(let i=0;i<MITARBEITERLISTE.length;i++){
    const ma=MITARBEITERLISTE[i];
    try{
      await sbFetch('/rest/v1/mitarbeiter',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
        body:JSON.stringify({id:ma.id,name:ma.name,position:i,geaendert_am:new Date().toISOString()})});
      mitarbeiterDbVerfuegbar=true;
    }catch(e){
      console.error('Mitarbeiter konnte nicht in der Datenbank gespeichert werden — bleibt vorerst nur lokal auf diesem Gerät:',e);
      mitarbeiterDbVerfuegbar=false;
    }
  }
}
async function deleteMitarbeiterRemote(id){
  try{await sbFetch('/rest/v1/mitarbeiter?id=eq.'+id,{method:'DELETE'});}catch(e){console.error(e);}
}

// ── HÖHE DER MITARBEITERZEILE (per Ziehgriff verstellbar, live auf allen Geräten synchronisiert) ──
const MAB_HOEHE_SENTINEL_ID='__mab_hoehe__';
const MAB_HOEHE_BASIS=52; // vh-Wert, bei dem der Skalierungsfaktor 1 entspricht
let mitarbeiterzeileHoeheVh=parseFloat(localStorage.getItem('werkstatt-mab-hoehe-cache'))||30;

function applyMitarbeiterzeileHoehe(vh,positionieren){
  mitarbeiterzeileHoeheVh=Math.max(20,Math.min(80,vh));
  const el=document.getElementById('mitarbeiterBoard');
  if(el){
    el.style.height='auto';
    el.style.maxHeight=mitarbeiterzeileHoeheVh+'dvh';
    el.style.setProperty('--mab-scale',(mitarbeiterzeileHoeheVh/MAB_HOEHE_BASIS).toFixed(3));
  }
  if(positionieren!==false)positionMabResizeGrip();
}
function positionMabResizeGrip(){
  const grip=document.getElementById('mabResizeGrip');
  const board=document.getElementById('mitarbeiterBoard');
  if(!grip||!board||window.innerWidth<=768)return;
  const rect=board.getBoundingClientRect();
  grip.style.top=Math.max(4,rect.top-13)+'px';
}
window.addEventListener('resize',positionMabResizeGrip);

async function saveMitarbeiterzeileHoehe(vh){
  localStorage.setItem('werkstatt-mab-hoehe-cache',vh);
  try{
    await sbFetch('/rest/v1/mitarbeiter',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({id:MAB_HOEHE_SENTINEL_ID,name:JSON.stringify({vh}),position:-1,geaendert_am:new Date().toISOString()})});
  }catch(e){console.error('Höhe konnte nicht in der Datenbank gespeichert werden — bleibt vorerst nur lokal auf diesem Gerät:',e);}
}

(function initMabResizeGrip(){
  const grip=document.getElementById('mabResizeGrip');
  if(!grip)return;
  let ziehStartY=0,ziehStartHoeheVh=MAB_HOEHE_BASIS,amZiehen=false;
  grip.addEventListener('pointerdown',e=>{
    amZiehen=true;ziehStartY=e.clientY;ziehStartHoeheVh=mitarbeiterzeileHoeheVh;
    try{grip.setPointerCapture(e.pointerId);}catch(err){}
  });
  grip.addEventListener('pointermove',e=>{
    if(!amZiehen)return;
    const deltaPx=ziehStartY-e.clientY; // nach oben ziehen = größer
    const deltaVh=deltaPx/window.innerHeight*100;
    applyMitarbeiterzeileHoehe(ziehStartHoeheVh+deltaVh);
  });
  const beenden=()=>{
    if(!amZiehen)return;
    amZiehen=false;
    saveMitarbeiterzeileHoehe(mitarbeiterzeileHoeheVh);
  };
  grip.addEventListener('pointerup',beenden);
  grip.addEventListener('pointercancel',beenden);
})();

// Zustand des "+"-Eingabefelds für individuelle Aufgaben — bewusst außerhalb von render()
// gehalten, damit ein Neuzeichnen (z.B. durch Live-Aktualisierung) das offene Feld nicht
// verliert oder vorzeitig abschickt.
let aufgabeInputOffenFuer=null;
let aufgabeInputText='';

function renderMitarbeiterZeilen(){
  const c=document.getElementById('mabRows'); if(!c) return;
  c.innerHTML='';
  if(MITARBEITERLISTE.length===0){
    c.innerHTML='<div style="color:var(--text-muted);font-size:12px;padding:6px 2px">Noch keine Mitarbeiter angelegt — im Adminbereich hinzufügen.</div>';
    return;
  }

  function buildHalf(ma){
    const half=document.createElement('div');half.className='mab-half';
    if(!ma){half.classList.add('empty-slot');return half;}
    half.dataset.maId=ma.id;

    const name=document.createElement('div');name.className='mab-name';name.textContent=ma.name;name.title=ma.name;
    half.appendChild(name);

    const cardsWrap=document.createElement('div');cardsWrap.className='mab-cards';

    const zugewiesen = autos.filter(a=>a.zugewiesenAn===ma.id)
      .sort((x,y)=>(x.zuwPos||0)-(y.zuwPos||0));

    if(zugewiesen.length===0){
      const empty=document.createElement('span');empty.className='mab-empty-text';empty.textContent='Auftrag hierher ziehen';
      cardsWrap.appendChild(empty);
    }

    zugewiesen.forEach((a,i)=>{
      const mc=document.createElement('div');mc.className='mab-card'+(i===0?' aktuell':'')+(a.istAufgabe?' mab-card-aufgabe':'');
      wireDraggable(mc,'assign',()=>a.id,()=>ma.id);

      const moveBtn=document.createElement('button');moveBtn.className='mab-card-x btn-move';moveBtn.textContent='↔';moveBtn.title='Verschieben';
      moveBtn.addEventListener('click',e=>{e.stopPropagation();openMoveMenu(a.id);});
      if(a.istAufgabe){
        const textEl=document.createElement('span');textEl.className='mab-card-aufgabetext';textEl.textContent='📌 '+(a.aufgabeText||'');
        const xBtn=document.createElement('button');xBtn.className='mab-card-x';xBtn.textContent='✕';xBtn.title='Aufgabe löschen';
        xBtn.addEventListener('click',e=>{e.stopPropagation();autos=autos.filter(v=>v.id!==a.id);deleteAuto(a.id);render();});
        mc.appendChild(textEl);mc.appendChild(moveBtn);mc.appendChild(xBtn);
      }else{
        const kzEl=document.createElement('span');kzEl.className='mab-card-kz';kzEl.textContent=a.kennzeichen||'—';
        const fahrzeugEl=document.createElement('span');fahrzeugEl.className='mab-card-fahrzeug';fahrzeugEl.textContent=a.fahrzeug||'';
        const kundeEl=document.createElement('span');kundeEl.className='mab-card-kunde';kundeEl.textContent=a.kunde||'';
        const xBtn=document.createElement('button');xBtn.className='mab-card-x';xBtn.textContent='✕';xBtn.title='Zuweisung entfernen';
        xBtn.addEventListener('click',e=>{e.stopPropagation();a.zugewiesenAn=null;a.zuwPos=0;saveAuto(a);render();});
        mc.appendChild(kzEl);mc.appendChild(fahrzeugEl);mc.appendChild(kundeEl);mc.appendChild(moveBtn);mc.appendChild(xBtn);
      }
      cardsWrap.appendChild(mc);
    });

    half.appendChild(cardsWrap);

    if(aufgabeInputOffenFuer===ma.id){
      const inp=document.createElement('input');inp.className='mab-add-input';inp.placeholder='Aufgabe … (Enter)';
      inp.value=aufgabeInputText;
      inp.addEventListener('input',()=>{aufgabeInputText=inp.value;});
      const commit=()=>{
        const txt=inp.value.trim();
        aufgabeInputOffenFuer=null;aufgabeInputText='';
        if(!txt){render();return;}
        const maxPos=Math.max(0,...autos.filter(v=>v.zugewiesenAn===ma.id).map(v=>v.zuwPos||0));
        const neu={id:genId(),kennzeichen:'',fahrzeug:'',kunde:'',prioritaet:'Normal',hinweise:[],platz:'',
          status:'aufgabe',auftragsnr:'',arbeiten:[],material:[],lieferscheine:[],dateien:[],
          zugewiesenAn:ma.id,zuwPos:maxPos+1,istAufgabe:true,aufgabeText:txt,
          eingang:uhrzeit(),datum:datumKurz(),statusSeit:uhrzeit()};
        autos.push(neu);saveAuto(neu);render();
      };
      inp.addEventListener('keydown',e2=>{
        if(e2.key==='Enter')commit();
        if(e2.key==='Escape'){aufgabeInputOffenFuer=null;aufgabeInputText='';render();}
      });
      half.appendChild(inp);
      setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0);
    }else{
      const addBtn=document.createElement('button');addBtn.className='mab-add-btn';addBtn.textContent='+';addBtn.title='Individuelle Aufgabe hinzufügen';
      addBtn.addEventListener('click',e=>{
        e.stopPropagation();
        aufgabeInputOffenFuer=ma.id;aufgabeInputText='';
        render();
      });
      half.appendChild(addBtn);
    }

    return half;
  }

  for(let i=0;i<MITARBEITERLISTE.length;i+=2){
    const pair=document.createElement('div');pair.className='mab-row-pair';
    pair.appendChild(buildHalf(MITARBEITERLISTE[i]));
    pair.appendChild(document.createElement('div')).className='mab-divider';
    pair.appendChild(buildHalf(MITARBEITERLISTE[i+1]||null));
    c.appendChild(pair);
  }
}

// ── MITARBEITER (Auf Karte "ich arbeite daran") ──
function initMyName(){if(!myName)setTimeout(()=>askMyName(),800);else updateNameDisplay();}
function updateNameDisplay(){
  const av=document.getElementById('myAvatar'),tx=document.getElementById('myNameText');
  if(myName){av.textContent=myName.charAt(0).toUpperCase();tx.textContent=myName;tx.style.color='var(--text)';}
  else{av.textContent='?';tx.textContent='Wer bist du?';tx.style.color='var(--red)';}
}
function askMyName(){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px';
  o.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border2);border-top:3px solid var(--red);border-radius:6px;padding:28px;max-width:360px;width:100%">
    <div style="font-family:var(--font-head);font-size:15px;color:var(--text);margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em">Wer bist du?</div>
    <input id="nameInput" type="text" placeholder="Deinen Namen eingeben …"
      style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text);padding:11px 14px;font-size:15px;outline:none;margin-bottom:12px"
      onkeydown="if(event.key==='Enter')document.getElementById('nameSaveBtn').click()"/>
    <button id="nameSaveBtn" class="btn-primary" style="width:100%">Speichern</button>
  </div>`;
  document.body.appendChild(o);
  const inp=o.querySelector('#nameInput');inp.value=myName;setTimeout(()=>inp.focus(),100);
  o.querySelector('#nameSaveBtn').addEventListener('click',()=>{const v=inp.value.trim();if(!v)return;myName=v;localStorage.setItem('werkstatt-name',myName);document.body.removeChild(o);updateNameDisplay();});
}
function changeMyName(){askMyName();}
async function toggleMitarbeiter(autoId){
  if(!myName){askMyName();return;}
  const a=autos.find(x=>x.id===autoId);if(!a)return;
  if(!a.mitarbeiter)a.mitarbeiter=[];
  const idx=a.mitarbeiter.findIndex(m=>m.name===myName);
  if(idx>=0)a.mitarbeiter.splice(idx,1);else a.mitarbeiter.push({name:myName,seit:uhrzeit()});
  await saveAuto(a);render();

async function removeMitarbeiter(autoId,name){

function handleSearch(val){
  currentSearch=val.trim().toLowerCase();
  document.getElementById('searchClear').classList.toggle('visible',currentSearch.length>0);
  if(currentSearch.length<2)return;
  const hits=autos.filter(a=>a.kennzeichen.toLowerCase().includes(currentSearch)||(a.kunde||'').toLowerCase().includes(currentSearch)||(a.fahrzeug||'').toLowerCase().includes(currentSearch));
  if(!hits.length)return;
  hits.forEach(a=>{if(autos.filter(x=>x.status===a.status).length>=COLLAPSE_AT)expandedCards.add(a.id);else collapsedCards.delete(a.id);});
  render();
  setTimeout(()=>{
    hits.forEach(a=>{
      const s=STATI.find(x=>x.id===a.status);
      document.querySelectorAll('.card-top-kz').forEach(el=>{
        if(el.textContent.trim()===(a.kennzeichen||'—')){
          const wrap=el.closest('.card-wrap');
          if(wrap){wrap.style.setProperty('--flash-color',s?.accent||'#fff');wrap.classList.remove('card-flash');void wrap.offsetWidth;wrap.classList.add('card-flash');wrap.addEventListener('animationend',()=>wrap.classList.remove('card-flash'),{once:true});}
        }
      });
    });
  },50);
}

// ── PDF-VIEWER (öffnet PDFs innerhalb der App statt in neuem Tab) ──
function openPdfViewer(url,name,autoPrint){
  const istBild=/\.(jpe?g|png|gif|webp|heic|bmp)$/i.test(name||'');
  openModal(`
    <div class="modal-header">
      <span class="modal-title">${istBild?'🖼':'📄'} ${name||(istBild?'Bild':'PDF-Dokument')}</span>
      <div class="modal-header-actions">
        <button class="btn-primary" id="btnPdfDrucken">🖨 Drucken</button>
        <button class="btn-secondary" onclick="closeModal()">✕ Schließen</button>
      </div>
    </div>
    <iframe id="pdfViewerFrame" src="${url}" style="width:100%;height:80vh;border:1px solid var(--border2);border-radius:6px;background:#fff;display:block"></iframe>
  `);
  document.getElementById('modalBox').classList.add('modal-box-large');
  document.getElementById('btnPdfDrucken').addEventListener('click',()=>{
    const frame=document.getElementById('pdfViewerFrame');
    try{
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }catch(e){
      // Manche PDFs liegen auf einer anderen Domain (z.B. Cloud-Speicher) — der Browser
      // verbietet dann das direkte Drucken aus dem eingebetteten Fenster heraus.
      // In dem Fall öffnet sich ausnahmsweise ein Tab, nur um den Druckdialog anzuzeigen.
      const w=window.open(url,'_blank');
      if(w)w.onload=()=>{try{w.print();}catch(err){}};
    }
  });
  if(autoPrint){
    document.getElementById('pdfViewerFrame').addEventListener('load',()=>{
      setTimeout(()=>document.getElementById('btnPdfDrucken')?.click(),200);
    },{once:true});
  }
}

function toggleHintDone(fid,i){editHinweise[i].done=!editHinweise[i].done;refreshHintsList(fid);}
function removeHint(fid,i){editHinweise.splice(i,1);refreshHintsList(fid);}

async function uploadSfkAuftrag(autoId,input,useKI){
  const file=input.files[0];if(!file)return;
  const a=autos.find(x=>x.id===autoId);if(!a)return;
  try{
    setSync('syncing','Hochladen');
    const url=await uploadFile(file,`auftraege/${autoId}/sfk_${Date.now()}_${file.name}`);
    a.dateien=(a.dateien||[]).filter(d=>d.typ!=='sfk_auftrag');
    a.dateien.push({name:file.name,url,typ:'sfk_auftrag',datum:datumKurz()});
    if(useKI){
      try{
        setSync('syncing','KI analysiert');
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
        const system=`Analysiere den SFK-Werkstattauftrag. Antworte NUR mit JSON ohne Markdown:{"kennzeichen":"","kunde":"","fahrzeug":"","auftragsnr":"","arbeiten":["kurze Beschreibung max 5 Wörter"]}`;
        const result=await callClaude(system,[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:'Analysiere diesen SFK-Werkstattauftrag.'}]);
        const parsed=JSON.parse(result);
        if(parsed.kennzeichen)a.kennzeichen=parsed.kennzeichen;
        if(parsed.kunde)a.kunde=parsed.kunde;
        if(parsed.fahrzeug)a.fahrzeug=parsed.fahrzeug;
        if(parsed.auftragsnr)a.auftragsnr=parsed.auftragsnr;
        if(Array.isArray(parsed.arbeiten)&&parsed.arbeiten.length>0){
          a.hinweise=parsed.arbeiten.map(t=>({text:t,done:false}));
        }
      }catch(kiErr){
        console.warn('KI-Erkennung beim Ersetzen fehlgeschlagen:',kiErr.message);
        alert('Datei wurde ersetzt, die KI-Erkennung ist aber fehlgeschlagen: '+kiErr.message);
      }
    }
    await saveAuto(a);setSync('ok','Live');openEdit(autoId);
  }catch(e){
    setSync('error','Fehler');
    console.error('SFK-Ersetzen fehlgeschlagen:',e);
    alert('Der Werkstattauftrag konnte nicht ersetzt werden:\n\n'+e.message+'\n\nBitte diese Meldung an den Support weitergeben.');
  }
}

      <button class="diag-btn diag-btn-nok ${val==='nok'?'active':''}" data-key="${key}" data-val="nok">✕</button>

    return `<div class="diag-row"><span class="diag-row-label">${label}</span>${statusBtns(key)}</div>`;}

  openModal(`

      <span class="diag-warn-icon">⚠️</span>
      <span>KM-Stand und TÜV sind noch leer. Beim erneuten Schließen wird das Fenster trotzdem geschlossen.</span>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Allgemein</div>
      <div class="diag-grid">${[...DIAG_ITEMS_LEFT,...DIAG_ITEMS_RIGHT].map(k=>diagRow(k,k)).join('')}</div>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Reifen</div>
      <div class="diag-grid">${DIAG_REIFEN.map(k=>diagRow(k,k)).join('')}</div>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Bremsen</div>
      <div class="diag-grid">${DIAG_BREMSEN.map(k=>diagRow(k,k)).join('')}</div>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Fehlerspeicher</div>
      <div class="diag-input-row"><textarea id="diag_fehlerspeicher" rows="2" placeholder="Fehlercodes …">${d.fehlerspeicher||''}</textarea></div>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Was muss gemacht werden?</div>
      <div class="diag-input-row"><textarea id="diag_was_machen" rows="3" placeholder="Erforderliche Arbeiten …">${d.was_machen||''}</textarea></div>
    </div>
    <div class="diag-section">
      <div class="diag-section-title">Hinweise</div>
      <div class="diag-input-row"><textarea id="diag_hinweise" rows="2" placeholder="Weitere Hinweise …">${d.hinweise||''}</textarea></div>
    </div>
    <div class="form-footer">
      <div id="diagSaved" style="font-size:12px;color:#4ade80;align-self:center;display:none">✓ Gespeichert</div>
      <button class="btn-secondary" onclick="closeModal()">Schließen</button>
      <button class="btn-primary" id="btnDiagPDF">⬇ PDF exportieren</button>
    </div>
  `);
  document.getElementById('modalBox').classList.add('modal-box-large');

  // Event Listeners für Buttons (OK / ✕ / Kein Nachweis)
  document.getElementById('modalBox').querySelectorAll('.diag-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.key;const val=btn.dataset.val;
      if(!a.diagnose)a.diagnose=emptyDiagnose();
      a.diagnose[key]=a.diagnose[key]===val?'':val;
      // UI sofort aktualisieren
      const row=btn.closest('.diag-btns');
      row.querySelectorAll('.diag-btn-ok').forEach(b=>b.classList.toggle('active',a.diagnose[key]==='ok'));
      row.querySelectorAll('.diag-btn-nok').forEach(b=>b.classList.toggle('active',a.diagnose[key]==='nok'));
      row.querySelectorAll('.diag-btn-kein').forEach(b=>b.classList.toggle('active',a.diagnose[key]==='kein_nachweis'));
      saveDiagNow(a);
    });
  });

  // Textfelder
  ['km','tuev','fehlerspeicher','was_machen','hinweise'].forEach(key=>{
    const el=document.getElementById('diag_'+key);
    if(el){
      el.addEventListener('input',()=>{
        if(!a.diagnose)a.diagnose=emptyDiagnose();
        a.diagnose[key]=el.value;
        if(key==='km'||key==='tuev')validateDiagnoseClose(a,false);
      });
      el.addEventListener('blur',()=>saveDiagNow(a));
    }
  });

  // TÜV abgelaufen Checkbox
  const tuevAbgelaufen=document.getElementById('diag_tuev_abgelaufen');
  const tuevFeld=document.getElementById('diag_tuev');
  if(tuevAbgelaufen&&tuevFeld){
    tuevAbgelaufen.addEventListener('change',()=>{
      if(!a.diagnose)a.diagnose=emptyDiagnose();
      a.diagnose.tuev_abgelaufen=tuevAbgelaufen.checked;
      if(tuevAbgelaufen.checked){
        if(!tuevFeld.dataset.vorherigerWert)tuevFeld.dataset.vorherigerWert=tuevFeld.value;
        tuevFeld.value='abgelaufen';
        a.diagnose.tuev='abgelaufen';
      }else{
        tuevFeld.value=tuevFeld.dataset.vorherigerWert&&tuevFeld.dataset.vorherigerWert!=='abgelaufen'?tuevFeld.dataset.vorherigerWert:'';
        a.diagnose.tuev=tuevFeld.value;
        delete tuevFeld.dataset.vorherigerWert;
      }
      validateDiagnoseClose(a,false);
      saveDiagNow(a);
    });
  }

  document.getElementById('btnDiagPDF').addEventListener('click',()=>exportDiagnosePDF(autoId));

  // Fenster: beim ersten Schließen-Versuch mit leeren Pflichtfeldern nur warnen,
  // beim zweiten Versuch trotzdem schließen
  let diagCloseAttempts=0;
  modalCloseGuard=()=>{
    if(validateDiagnoseClose(a,true))return true;
    diagCloseAttempts++;
    return diagCloseAttempts>=2;
  };
}

function validateDiagnoseClose(a,showWarning){
  const kmEl=document.getElementById('diag_km');
  const tuevEl=document.getElementById('diag_tuev');
  const kmVal=(kmEl?kmEl.value:(a.diagnose.km||'')).trim();
  const tuevVal=(tuevEl?tuevEl.value:(a.diagnose.tuev||'')).trim();
  const warnEl=document.getElementById('diagWarnBanner');
  const ok=!!kmVal&&!!tuevVal;

  if(kmEl)kmEl.closest('.diag-input-row').classList.toggle('error',!kmVal&&showWarning);
  if(tuevEl)tuevEl.closest('.diag-input-row').classList.toggle('error',!tuevVal&&showWarning);

  if(!ok){
    if(showWarning&&warnEl){
      warnEl.style.display='flex';
      warnEl.classList.remove('shake');void warnEl.offsetWidth;warnEl.classList.add('shake');
      if(typeof warnEl.scrollIntoView==='function')warnEl.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return false;
  }
  if(warnEl)warnEl.style.display='none';
  if(kmEl)kmEl.closest('.diag-input-row').classList.remove('error');
  if(tuevEl)tuevEl.closest('.diag-input-row').classList.remove('error');
  return true;
}

async function saveDiagNow(a){
  await saveAuto(a);
  const el=document.getElementById('diagSaved');
  if(el){el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2000);}
}

function openMoveMenu(autoId){
  const a=autos.find(x=>x.id===autoId);if(!a)return;
  const statusSection=a.istAufgabe?'':`
    <div class="section-label">Status ändern</div>
    <div class="move-options-grid">
      ${STATI.filter(s=>!s.hidden).map(s=>`<button class="move-option" data-type="status" data-value="${s.id}" ${a.status===s.id?'disabled':''} style="border-color:${s.accent}55">${s.icon} ${s.label}</button>`).join('')}
    </div>`;
  const mitarbeiterButtons=MITARBEITERLISTE.map(m=>`<button class="move-option" data-type="mitarbeiter" data-value="${m.id}" ${a.zugewiesenAn===m.id?'disabled':''}>👤 ${m.name}</button>`).join('');
  const entfernenBtn=`<button class="move-option" data-type="mitarbeiter" data-value="" ${!a.zugewiesenAn?'disabled':''}>✕ Zuweisung entfernen</button>`;

  let reihenfolgeSection='';
  if(a.zugewiesenAn){
    const zugewieseneMa=MITARBEITERLISTE.find(m=>m.id===a.zugewiesenAn);
    const andere=autos.filter(v=>v.zugewiesenAn===a.zugewiesenAn&&v.id!==a.id).sort((p,q)=>(p.zuwPos||0)-(q.zuwPos||0));
    if(andere.length>0){
      const vorButtons=andere.map(v=>`<button class="move-option" data-type="reorder" data-value="${v.id}">⬆ Vor: ${v.kennzeichen||v.aufgabeText||'Eintrag'}</button>`).join('');
      const ansEndeBtn=`<button class="move-option" data-type="reorder" data-value="">⬇ Ans Ende stellen</button>`;
      reihenfolgeSection=`
        <div class="section-label" style="margin-top:14px">Reihenfolge bei ${zugewieseneMa?zugewieseneMa.name:'Mitarbeiter'}</div>
        <div class="move-options-grid">${vorButtons}${ansEndeBtn}</div>`;
    }
  }

  openModal(`
    <div class="modal-header">
      <span class="modal-title">↔ Verschieben — ${a.kennzeichen||a.aufgabeText||'Auftrag'}</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${statusSection}
    <div class="section-label" style="margin-top:14px">Mitarbeiter zuweisen</div>
    <div class="move-options-grid">
      ${mitarbeiterButtons||'<div style="color:var(--text-muted);font-size:12px">Noch keine Mitarbeiter angelegt</div>'}
      ${MITARBEITERLISTE.length?entfernenBtn:''}
    </div>
    ${reihenfolgeSection}
  `);
  document.getElementById('modalBox').querySelectorAll('.move-option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.type==='status'){
        a.status=btn.dataset.value;a.statusSeit=uhrzeit();
        saveAuto(a);closeModal();render();
      }else if(btn.dataset.type==='mitarbeiter'){
        const maId=btn.dataset.value;
        if(maId){
          const maxPos=Math.max(0,...autos.filter(v=>v.zugewiesenAn===maId).map(v=>v.zuwPos||0));
          a.zugewiesenAn=maId;a.zuwPos=maxPos+1;
        }else{
          a.zugewiesenAn=null;a.zuwPos=0;
        }
        saveAuto(a);closeModal();render();
      }else if(btn.dataset.type==='reorder'){
        const vorId=btn.dataset.value||null;
        let liste=autos.filter(v=>v.zugewiesenAn===a.zugewiesenAn&&v.id!==a.id).sort((p,q)=>(p.zuwPos||0)-(q.zuwPos||0));
        let einfuegeIndex=liste.length;
        if(vorId){const idx=liste.findIndex(v=>v.id===vorId);if(idx>=0)einfuegeIndex=idx;}
        liste.splice(einfuegeIndex,0,a);
        liste.forEach((item,idx)=>{item.zugewiesenAn=a.zugewiesenAn;item.zuwPos=idx+1;saveAuto(item);});
        closeModal();render();
      }
    });
  });
}

async function erkenneLieferschein(autoId, lsIndex, file){
  const a=autos.find(x=>x.id===autoId); if(!a) return;
  const ls = a.lieferscheine[lsIndex]; if(!ls) return;

  const b64 = await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
  const mediaType = file.type.includes('pdf') ? 'application/pdf' : (file.type||'image/jpeg');
  const docType = file.type.includes('pdf') ? 'document' : 'image';

  const system = `Analysiere diesen Lieferschein/diese Rechnung. Antworte NUR mit JSON ohne Markdown:
{"lieferant":"Firmenname","nummer":"Lieferschein- oder Bestellnummer","datum":"TT.MM.JJJJ","betrag":Zahl,"waehrung":"EUR oder USD","positionen":["kurze Bezeichnung jedes einzelnen Ersatzteils/Artikels, max 5 Wörter pro Position"]}
Wichtig: betrag ist immer der NETTO-Betrag (ohne MwSt). Falls nur Brutto sichtbar ist, schätze den Netto-Betrag (Brutto / 1.19). Erkenne die Währung am Symbol (€ = EUR, $ = USD). Liste in "positionen" jede einzelne Artikelzeile des Lieferscheins auf (nicht Gebühren/Versand/Rabatte).`;

  const result = await callClaude(system, [
    { type: docType, source: { type: 'base64', media_type: mediaType, data: b64 } },
    { type: 'text', text: 'Analysiere diesen Lieferschein.' }
  ]);
  const parsed = JSON.parse(result);
  ls.lieferant = parsed.lieferant || '';
  ls.nummer    = parsed.nummer || '';
  ls.datumLs   = parsed.datum || '';
  ls.betrag    = parseFloat(parsed.betrag) || 0;
  ls.waehrung  = parsed.waehrung === 'USD' ? 'USD' : 'EUR';
  ls.positionen = Array.isArray(parsed.positionen) ? parsed.positionen.filter(p=>p&&p.trim()) : [];

  // Erkannte Positionen automatisch ins verbrauchte Material übernehmen (Duplikate überspringen)
  a.material = a.material || [];
  let neuHinzugefuegt = 0;
  ls.positionen.forEach(pos=>{
    const bereitsVorhanden = a.material.some(m=>textAehnlich(pos, m.bezeichnung));
    if(!bereitsVorhanden){
      a.material.push({bezeichnung:pos, menge:'', einheit:'Stk'});
      neuHinzugefuegt++;
    }
  });

  await saveAuto(a);
  renderLSList(autoId);
  renderMaterialKosten(autoId);
  renderMaterialList(autoId);
  zeigeAutoMaterialHinweis(autoId, neuHinzugefuegt);
  return;
}

// ── ABGLEICH: Positionen auf Lieferscheinen vs. eingetragenes Material ──
function textAehnlich(a,b){
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9äöüß ]/g,'').trim();
  const na=norm(a),nb=norm(b);
  if(!na||!nb)return false;
  if(na===nb)return true;
  if(na.includes(nb)||nb.includes(na))return true;
  // Grobe Wort-Überschneidung: mind. die Hälfte der (längeren) Wörter kommt auch im anderen Text vor
  const wa=na.split(' ').filter(w=>w.length>2), wb=nb.split(' ').filter(w=>w.length>2);
  if(wa.length===0||wb.length===0)return false;
  const treffer=wa.filter(w=>wb.some(w2=>w2.includes(w)||w.includes(w2))).length;
  return treffer/Math.max(wa.length,wb.length)>=0.5;
}

function pruefeFehlendeTeile(autoId){
  const a=autos.find(x=>x.id===autoId);if(!a)return;
  const alleLsPositionen=(a.lieferscheine||[]).flatMap(ls=>(ls.positionen||[]).map(p=>({text:p,lieferant:ls.lieferant||'Lieferschein'})));
  const materialTexte=(a.material||[]).map(m=>m.bezeichnung||'');
  const fehlend=alleLsPositionen.filter(pos=>!materialTexte.some(mt=>textAehnlich(pos.text,mt)));
  const el=document.getElementById('materialFehlendHinweis');
  if(!el)return;
  if(fehlend.length===0){el.style.display='none';el.innerHTML='';return;}
  el.style.display='block';

    <div style="font-size:12px;color:#fecaca;margin-bottom:8px">Diese Positionen stehen auf einem Lieferschein, tauchen aber nicht im verbrauchten Material auf – bitte prüfen, ob sie vergessen wurden:</div>
    ${fehlend.map((f,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">

      <button class="btn-secondary" data-fehlend-idx="${i}" style="font-size:11px;padding:4px 8px">+ Übernehmen</button>
    </div>`).join('')}`;
  el.querySelectorAll('[data-fehlend-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const f=fehlend[btn.dataset.fehlendIdx];
      a.material=a.material||[];

      saveAuto(a);
      renderMaterialList(autoId);
      pruefeFehlendeTeile(autoId);
    });
  });
}
